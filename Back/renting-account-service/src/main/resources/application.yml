spring:
  profiles:
    include: datasource,redis
  application:
    name: renting-account-service
  freemarker:
    enabled: true
    suffix: .html
    request-context-attribute: rc
    content-type: text/html
    charset: UTF-8
  mvc:
    throw-exception-if-no-handler-found: true
  resources:
    add-mappings: false

  datasource:
    url: jdbc:mysql://localhost:3306/renting_account?useUnicode=true&characterEncoding=UTF-8

mybatis:
  type-aliases-package: com.nbmly.renting.pojo
  mapper-locations: classpath*:com/nbmly/renting/mapper/xml/*.xml
  configuration:
    map-underscore-to-camel-case: true


server:
  port: ${account.port}
  servlet:
    context-path: /account

eureka:
  client:
    service-url:
      defaultZone: ${eureka.server.url}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${spring.application.instance_id:${server.port}}

# 设置ribbon超时时间
ribbon:
  ReadTimeout: 6000
  ConnectTimeout: 6000


